[project]
name = "k3q-arxml"
version = "1.0.0"
description = "A lightweight Python library for reading and editing AUTOSAR ARXML files"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "click==8.2.1",
    "loguru==0.7.3",
    "lxml==5.4.0",
    "pydantic==2.14.1",
    "xsdata[cli]==26.2",
]

[dependency-groups]
dev = [
    "ruff==0.13.3",
]

[project.urls]
Repository = "https://github.com/luojiaaoo/k3q_arxml"

[tool.ruff]
target-version = "py311"
line-length = 180
extend-exclude = ["k3q_arxml/autosar.py", "k3q_arxml/.codegen-*"]

[tool.ruff.format]
quote-style = "single"

