[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "k3q-arxml"
version = "2.3.0"
description = "A lightweight Python library for reading and editing AUTOSAR ARXML files"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "click>=8.2.1,<9",
    "loguru>=0.7.3,<0.8",
    "lxml>=5.4.0,<6",
    "mcp>=2.3.0,<3",
    "pydantic>=2.14.1,<3",
    "xsdata[cli]>=26.2,<27",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.13.3,<0.14",
]

[project.scripts]
k3q-arxml-mcp-00043 = "k3q_arxml.script.serve_mcp:main"
k3q-arxml-mcp-00044 = "k3q_arxml.script.serve_mcp:main"
k3q-arxml-mcp-00045 = "k3q_arxml.script.serve_mcp:main"
k3q-arxml-mcp-00046 = "k3q_arxml.script.serve_mcp:main"
k3q-arxml-mcp-00047 = "k3q_arxml.script.serve_mcp:main"
k3q-arxml-mcp-00048 = "k3q_arxml.script.serve_mcp:main"
k3q-arxml-mcp-00049 = "k3q_arxml.script.serve_mcp:main"
k3q-arxml-mcp-00050 = "k3q_arxml.script.serve_mcp:main"
k3q-arxml-mcp-00051 = "k3q_arxml.script.serve_mcp:main"
k3q-arxml-mcp-00052 = "k3q_arxml.script.serve_mcp:main"
k3q-arxml-mcp-4-2-2 = "k3q_arxml.script.serve_mcp:main"

[project.urls]
Repository = "https://github.com/luojiaaoo/k3q_arxml"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 180
extend-exclude = ["k3q_arxml/schemas/autosar_*.py", "**/.codegen-*"]

[tool.ruff.format]
quote-style = "single"

[tool.hatch.build.targets.wheel]
packages = ["k3q_arxml"]

[tool.hatch.build.targets.sdist]
include = [
    "/k3q_arxml",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.hatch.build]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/.codegen-*",
]

